<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="icon" type="image/png" href="TemplateData/favicon.png">
    <style>
      @font-face { font-family: "Kenney Future"; src: url("TemplateData/KenneyFuture.ttf"); }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #120d22; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #120d22; outline: none; }
      #loading {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 22px; background: radial-gradient(circle at 50% 45%, #2a1f4a 0%, #120d22 70%);
        font-family: "Kenney Future", system-ui, sans-serif; color: #dff4ff; text-align: center;
      }
      #loading h1 { margin: 0; font-size: clamp(28px, 7vw, 64px); letter-spacing: 0.08em; text-shadow: 0 0 18px #4fc8ff; }
      #loading p { margin: 0; font-size: clamp(11px, 2vw, 15px); color: #ffd54a; letter-spacing: 0.06em; }
      #bar { width: min(60vw, 420px); height: 12px; border: 2px solid #5ae6ff; box-shadow: 0 0 12px #5ae6ff66; }
      #fill { width: 0; height: 100%; background: #5ae6ff; transition: width 0.15s; }
      #error { display: none; max-width: 80vw; color: #ff8a8a; font-family: system-ui, sans-serif; font-size: 14px; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <h1>POEIRA ESTELAR</h1>
      <div id="bar"><div id="fill"></div></div>
      <p>Carregando a estação...</p>
      <div id="error"></div>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var fill = document.querySelector("#fill");

      // Garante que o teclado vai para o jogo ao clicar (inclusive dentro do iframe do itch.io).
      canvas.addEventListener("pointerdown", function () { canvas.focus(); });

      createUnityInstance(canvas, {
        arguments: [],
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      }, function (progress) {
        fill.style.width = (100 * progress) + "%";
      }).then(function () {
        loading.style.display = "none";
        canvas.focus();
      }).catch(function (message) {
        var error = document.querySelector("#error");
        error.style.display = "block";
        error.textContent = "Não foi possível carregar o jogo: " + message;
      });
    </script>
  </body>
</html>
